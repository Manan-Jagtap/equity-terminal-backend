name: Uptime check

# Free alerting channel (the 7-hour-outage lesson): every 30 minutes, assert
# prod /api/health returns 200. A failure fails the workflow run, and GitHub
# emails the repo owner — no external monitoring account needed. (GitHub cron
# is best-effort; treat this as a backstop, not a pager.)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    # 3 probes x 3 attempts x (curl timeout + 30s backoff) is ~9 minutes of
    # worst case, and the old 3-minute cap killed the run before the failing
    # probe could print its ::error:: line — the owner got a bare "timed out"
    # email naming nothing, which is the one thing this file exists to avoid.
    # The budget is only spent during a real outage; a healthy run is seconds.
    timeout-minutes: 10
    steps:
      - name: Probe /api/health (3 attempts, 30s apart) + error-storm threshold
        run: |
          URL="https://api.equityverdict.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -m 20 -o /tmp/h.json -w "%{http_code}" "$URL" || echo 000)
            # `|| true` matters: Actions runs bash -e, and when curl timed out
            # /tmp/h.json doesn't exist — a bare failing cat killed the script
            # on attempt 1 instead of retrying (18 Jul incident).
            body=$(cat /tmp/h.json 2>/dev/null || true)
            echo "attempt $i: HTTP $code $body"
            status=$(echo "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$status" = "ok" ]; then
              # NULL IS NOT ZERO. Every signal below used to be read with
              # `// 0`, and each one is produced under its own try/except in
              # /api/health — so with the database DOWN every query failed,
              # every field came back null, `// 0` turned null into the
              # passing value, and this job stayed green through a total DB
              # outage (the app now also reports that as status=degraded, so
              # the check above already fails; this is the belt to that
              # braces — a regression in the app's status logic must not turn
              # the alert back off). `integrity` is deliberately NOT in this
              # list: it is null until the first weekly sweep is stored and
              # its `// "green"` is pinned by tests/test_fix05_health_integrity.py.
              # Nor are the later signals: `integrity_age_days` is null for
              # the same reason (and when the stored blob has no parseable
              # `as_of`); `eod_names`/`eod_names_prior` are null on a fresh
              # database, on a scheduler that has not stamped them yet, and
              # whenever there is no PRIOR session to divide by; and
              # `error_hours_24h` reads the SAME ring as errors_1h
              # under the same strict contract, so it cannot be null without
              # errors_1h being null too — this loop already fires. Keeping
              # them out also means this file, which takes effect on MERGE,
              # runs cleanly against a backend that has not had its MANUAL
              # deploy yet (an absent key reads as null): that window must not
              # page.
              for sig in errors_1h scheduler_beat_min price_age_days; do
                raw=$(echo "$body" | jq -r ".$sig" 2>/dev/null || echo null)
                if [ "$raw" = "null" ]; then
                  echo "::error::Health is 200/ok but $sig is null — the signal was NOT measured (DB unreachable / table missing class); refusing to read null as 0"
                  exit 1
                fi
              done
              # Self-owned error telemetry: errors_1h is the trailing-hour count
              # of unhandled exceptions (app/error_log.py — data stays in OUR
              # DB; no third-party APM by DPDP posture). A storm alerts like
              # downtime does.
              errs=$(echo "$body" | jq -r '.errors_1h // 0' 2>/dev/null || echo 0)
              if [ "$errs" != "null" ] && [ "$errs" -gt 25 ] 2>/dev/null; then
                echo "::error::Health is 200 but errors_1h=$errs exceeds threshold 25 — error storm"
                exit 1
              fi
              # SUSTAINED ERRORS — the rule above catches storms and nothing
              # quieter. A job that fails on EVERY run (the 90-min intraday
              # fetch, a nightly wrapper) or a route broken for every caller
              # writes a handful of entries an hour, every hour, and never
              # nears 25 in any one hour; FIX-06 made those failures count and
              # this job still never saw them. error_hours_24h is how many of
              # the trailing 24 clock hours hold at least one error (0..25 —
              # the two partial edge hours included). Hours, not a count, on
              # purpose: a burst is one or two buckets however large (and was
              # paged above), so a resolved storm does not keep this red for a
              # day; a standing fault is most of the buckets. Errors in at
              # least 12 of the last 24 hours is not noise. What this does NOT
              # catch: a job that fails once a night (1 bucket) — that class
              # needs an OUTCOME signal per job (price_age_days, and now
              # integrity_age_days below, are the pattern), not a rate. The
              # `// 0` reads null and absent as "no evidence" on purpose — see
              # the null gate's note on why this field is not in it.
              ehrs=$(echo "$body" | jq -r '.error_hours_24h // 0' 2>/dev/null || echo 0)
              if [ "$ehrs" != "null" ] && [ "$ehrs" -gt 11 ] 2>/dev/null; then
                echo "::error::Sustained errors — error_hours_24h=$ehrs: errors in 12+ of the last 24 hours (a job failing on every run / a route broken for every caller; see /api/admin/errors)"
                exit 1
              fi
              # FIX-05/OPS-01: data-rot signals that used to page nobody. A dead
              # scheduler (separate container) froze prices/valuations while
              # health stayed 200; a stalled price feed rotted silently. Bare
              # ints from /api/health. (The `// 0` here is now only reached
              # after the null gate above has proven the field is present.)
              beat=$(echo "$body" | jq -r '.scheduler_beat_min // 0' 2>/dev/null || echo 0)
              if [ "$beat" != "null" ] && [ "$beat" -gt 120 ] 2>/dev/null; then
                echo "::error::Scheduler stalled — scheduler_beat_min=$beat exceeds 120 min (nightly ingest/valuation not running)"
                exit 1
              fi
              age=$(echo "$body" | jq -r '.price_age_days // 0' 2>/dev/null || echo 0)
              if [ "$age" != "null" ] && [ "$age" -gt 3 ] 2>/dev/null; then
                echo "::error::Prices stale — price_age_days=$age exceeds 3 (price pipeline died; 1-3 normal over weekends/holidays)"
                exit 1
              fi
              # PARTIAL SESSION — the 14 Aug 2026 miss. The gate above reads
              # max(date), and max(date) cannot see a session that landed for
              # part of the universe. The Dhan EOD top-up never ran that day;
              # the daily history self-heal seeded 21 brand-new listings under
              # that date; max(date) therefore read 0 days old while 992 of
              # ~1013 names had no candle at all. Nothing paged, and it was
              # found by hand three days later. eod_names is how many distinct
              # names carry the newest SETTLED session (the scheduler holds it
              # back until that session's write window has closed, so a probe
              # landing mid-run grades the previous one instead of paging about
              # a write that is about to finish); eod_names_prior is the same
              # for the session before it.
              #
              # RELATIVE, never a fixed floor: the universe drifts (1009 -> 1013
              # over recent weeks) and index churn/onboarding moves it again
              # every month, so an absolute number is either wrong today or
              # wrong in a month. 80% of the previous session is far below any
              # honest drift and far above the 2% (21/1013) this exists to
              # catch. It is the SAME 80% app/eod_coverage.py repairs on
              # (MIN_COVERAGE_PCT), pinned by a test, so this alert can never
              # fire on a session the self-heal thinks is fine — nor stay quiet
              # on one it is retrying three times a day.
              #
              # Each field is proved to be an integer before it is compared —
              # the null-is-not-zero rule, applied the same way the content
              # probe applies it to `filled`. Absent, null or unparseable means
              # NOT MEASURED (fresh database, no prior session, or a backend
              # that has not had its MANUAL deploy yet — this file takes effect
              # on MERGE), and not measured is not an outage.
              eod_names=$(echo "$body" | jq -r '.eod_names // empty' 2>/dev/null || true)
              eod_prior=$(echo "$body" | jq -r '.eod_names_prior // empty' 2>/dev/null || true)
              eod_ok=1
              for v in "$eod_names" "$eod_prior"; do
                case "$v" in ''|*[!0-9]*) eod_ok=0 ;; esac
              done
              if [ "$eod_ok" = "1" ] && [ "$eod_prior" -gt 0 ] && [ $((eod_names * 100)) -lt $((eod_prior * 80)) ]; then
                echo "::error::EOD session is PARTIAL — only $eod_names names carry the latest settled session against $eod_prior on the one before it (under 80%). The daily Dhan top-up did not run, or died part-way; price_age_days above cannot see this (14 Aug 2026: 21 names vs 1013, invisible for three days). Check the scheduler's 10:15 UTC run_prices slot and its 'EOD self-heal' log lines"
                exit 1
              fi
              # FIX-05/OPS-06: weekly integrity sweep verdict onto the SAME
              # (email) channel — a `red` sweep (a P1 data-integrity finding) now
              # fails this run instead of sitting on a token-gated admin page.
              integ=$(echo "$body" | jq -r '.integrity // "green"' 2>/dev/null || echo green)
              if [ "$integ" = "red" ]; then
                echo "::error::Data-integrity sweep is RED — a P1 finding is live at rest (see /api/admin/data-integrity)"
                exit 1
              fi
              # SWEEP FRESHNESS. `integrity` is a verdict with no date: a green
              # from a sweep that stopped running (the Sunday job raising, the
              # schedule line lost, a Sunday-03:00 restart skipping the slot
              # for a week) stayed green forever, and this job kept grading a
              # universe that no longer exists. integrity_age_days is whole
              # days since the stored sweep's own `as_of`. The sweep is weekly
              # (Sun 03:00 UTC, queued behind the 00:30 full refresh in a
              # single-threaded loop): 0-6 is normal, 7 is the due Sunday
              # itself — including a refresh overrunning into the slot — so
              # `> 7` fires from Monday 03:00 UTC after a missed sweep. Null
              # (no sweep ever stored / no parseable `as_of`) is not an alarm,
              # the same contract as `integrity` above; the `// 0` here is that
              # contract, not the null-is-zero mistake the gate above forbids.
              # A dead scheduler is scheduler_beat_min's alarm; this one is
              # for the scheduler that is alive and skipping THIS job.
              sage=$(echo "$body" | jq -r '.integrity_age_days // 0' 2>/dev/null || echo 0)
              if [ "$sage" != "null" ] && [ "$sage" -gt 7 ] 2>/dev/null; then
                echo "::error::Data-integrity sweep is STALE — integrity_age_days=$sage exceeds 7 (the weekly Sun 03:00 UTC sweep has stopped running; its '$integ' verdict is not current — POST /api/admin/data-integrity/run re-grades now, then find out why the scheduler skipped it)"
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::error::Production health check FAILED after 3 attempts (HTTP $code, status=${status:-<none>} $(echo "$body" | jq -r '.degraded_reason // empty' 2>/dev/null))"
          exit 1

      - name: Probe the Vercel frontend (equityverdict.com)
        # OPS-08: the API was watched but the frontend wasn't — Vercel silently
        # missed a merge webhook on 20 Jul and nobody was alerted. Assert the app
        # actually serves (200 + the React mount marker), so a broken/stale/absent
        # deploy fails this run and emails the owner like an API outage does.
        run: |
          URL="https://equityverdict.com"
          for i in 1 2 3; do
            code=$(curl -sL -m 20 -o /tmp/fe.html -w "%{http_code}" "$URL" || echo 000)
            body=$(cat /tmp/fe.html 2>/dev/null || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && echo "$body" | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Frontend FAILED — equityverdict.com not serving the app (HTTP $code; Vercel missed-webhook / broken-build class)"
          exit 1

      - name: Probe a real CONTENT path (/api/companies) — 200 alone is a green shell
        # /api/health is a LIVENESS probe: it answers from its own try/except'd
        # signals and touches no content route, so every data route in the app
        # could 500 and both steps above would still be green. This is the
        # CORRECTNESS probe — one public, unauthenticated route driven end to
        # end. /api/companies?nifty50=true is the screener's own query
        # (Company ⨝ MarketSnapshot, overlaid with Valuation / CompanyInsight /
        # latest facts), the first request the terminal makes on load, and ~53
        # rows instead of ~1000: a real database read, a small payload.
        #
        # NOT /api/universe, the other obvious candidate: it returns module
        # constants and never opens a session, so it serves a full ticker list
        # at 200 straight through a total outage — the exact green shell this
        # step exists to close.
        #
        # Three assertions, because a broken backend has passed each one alone:
        #   1. HTTP 200 — the route did not 500.
        #   2. A JSON ARRAY, non-empty. 200 with `{"error": ...}`, or with `[]`
        #      (table empty or renamed, a purge that ran before its validation),
        #      is downtime wearing a success code.
        #   3. Rows that CARRY DATA: at least 40 must have both a non-null
        #      `price` and a non-empty `verdict`. Rows survive with every field
        #      null — a broken join, a wiped price table, a valuation blob
        #      replaced blind (DATA-12 lost ~half the universe that way and
        #      nothing paged) — and a length check reads that as healthy. This
        #      is a floor, not equality: index churn or a name missing a
        #      snapshot must not page, losing a quarter of the screener must.
        #      Since filled <= rows, it is also the row-count floor.
        #
        # Unreadable output is never read as zero-and-therefore-fine — the
        # null-is-not-zero rule the health gate above learned the hard way. Each
        # count is proved to be an integer before it is compared; a body jq
        # cannot parse (truncation, an HTML error page from the edge) is retried
        # like a non-200 rather than paging. A body we DID parse fails
        # immediately with no retry: no amount of waiting turns an empty
        # screener into a full one, and this route is cached in-process for
        # 5 minutes, so all three attempts would be served the same emptiness.
        #
        # That 5-minute cache is also this probe's limit, worth knowing when it
        # pages: for up to 5 minutes after the database dies this step can still
        # pass on cached rows. It gates the correctness of the data path; the
        # null-signal gate in the health step is what watches the database.
        run: |
          URL="https://api.equityverdict.com/api/companies?nifty50=true"
          for i in 1 2 3; do
            # -m 45, not the health probe's 20: a cold process rebuilds the whole
            # screener on the first request before it can answer this one.
            code=$(curl -s -m 45 -o /tmp/co.json -w "%{http_code}" "$URL" || echo 000)
            # `|| true` for the same reason as the health probe: on a timeout
            # /tmp/co.json does not exist, and a bare failing read kills the
            # script under bash -e instead of retrying.
            rows=$(jq 'if type == "array" then length else -1 end' /tmp/co.json 2>/dev/null || true)
            echo "attempt $i: HTTP $code rows=${rows:-<unreadable>}"
            if [ "$code" != "200" ]; then sleep 30; continue; fi
            case "$rows" in
              -1)
                echo "::error::/api/companies is HTTP 200 but the body is not a JSON array — an error object served as success"
                exit 1 ;;
              0)
                echo "::error::/api/companies is HTTP 200 with ZERO rows — the route answers and the screener is empty (companies/market_snapshots empty or renamed, or a purge that ran before its validation)"
                exit 1 ;;
              ''|*[!0-9]*)
                sleep 30; continue ;;
            esac
            filled=$(jq '[.[] | select((.price != null) and (.verdict != null) and (.verdict != ""))] | length' /tmp/co.json 2>/dev/null || true)
            case "$filled" in
              ''|*[!0-9]*)
                echo "::error::/api/companies returned $rows rows that could not be inspected (jq failed on the elements) — refusing to call an unreadable payload healthy"
                exit 1 ;;
            esac
            if [ "$filled" -lt 40 ]; then
              echo "::error::/api/companies is HTTP 200 but only $filled rows carry both a price and a verdict — below the floor of 40 (~53 expected, $rows returned). Either the screener lost names (a wipe, a purge that ran before its validation) or rows are served with their data missing (broken join, wiped prices, blind-replaced valuations) — a row count alone reads both as healthy"
              exit 1
            fi
            echo "content OK: $rows rows, $filled priced and graded"
            exit 0
          done
          echo "::error::CONTENT path FAILED after 3 attempts — /api/companies unusable (last HTTP $code, rows=${rows:-<unreadable body>}). /api/health can be green while this is down: this is the route the terminal actually loads."
          exit 1
