name: CI

# The guardrail the enterprise audit found missing: the test suite had been
# broken at COLLECTION for weeks with nobody noticing, because nothing ran it.
# Every push/PR now runs the full backend suite; a red X is the alarm.
#
# FIX-26: a second job runs the SAME suite on Postgres (prod is Postgres, CI was
# SQLite-only — the dialect-specific branches executed for the first time in
# production), plus a narrow lint gate that catches the undefined-name /
# syntax-error class — exactly the `_dt` NameError and the ENG-01 un-imported
# macro_data that shipped live.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff pip-audit
      - name: Lint gate — undefined names & syntax errors (bug class, not style)
        run: ruff check --select E9,F63,F7,F82 app/
      # SEC-13: dependency-CVE visibility. Non-blocking (|| true) on purpose —
      # a newly-disclosed advisory in a transitive dep must NOT hard-block an
      # unrelated hotfix deploy; it surfaces in the CI log so a bump can be
      # scheduled. Deps are pinned, so the fix is always a deliberate edit.
      - name: Dependency audit (pip-audit, report)
        run: pip-audit -r requirements.txt || true
      - name: Run test suite (SQLite)
        env:
          DATABASE_URL: "sqlite:////tmp/ci_terminal.db"
        run: python -m pytest tests/ -q
      - name: Parity fixtures must still match the committed ones (ARC-05)
        # This step used to regenerate into /tmp and never look at the result,
        # proving only that the generators do not crash. That left the drift it
        # was named for wide open, and made the FRONTEND's green parity run
        # meaningless in the one case that matters:
        #
        #   engines.py changes -> nobody regenerates -> frontend CI compares
        #   engine.js against the STALE committed fixtures -> 60/60, 48/48, and
        #   the two engines have actually diverged.
        #
        # The only guard was scripts/hooks/pre-push, which is local-only, opt-out
        # via --no-verify, absent after a fresh clone, and never runs at all when
        # main is merged on GitHub — the normal path here.
        #
        # The fixtures live in the frontend repo, which is public, so fetch the
        # exact artifact the frontend tests consume rather than committing a
        # second copy that could itself drift. Compared as parsed JSON, not
        # bytes, so key order and whitespace cannot cause a false failure.
        run: |
          set -euo pipefail
          python tests/gen_parity_cases.py /tmp/parityCases.json
          python tests/gen_derive_cases.py /tmp/deriveCases.json
          RAW=https://raw.githubusercontent.com/Manan-Jagtap/equity-terminal/main/tests
          for f in parityCases deriveCases; do
            curl -fsSL "$RAW/$f.json" -o "/tmp/$f.committed.json"
            python - "$f" <<'PY'
          import json, sys
          f = sys.argv[1]
          fresh = json.load(open(f"/tmp/{f}.json"))
          committed = json.load(open(f"/tmp/{f}.committed.json"))
          if fresh != committed:
              print(f"!! FIXTURE DRIFT in {f}.json", file=sys.stderr)
              print("   The engine changed but the committed fixtures did not.", file=sys.stderr)
              print("   The frontend parity suite is now checking engine.js against a stale", file=sys.stderr)
              print("   snapshot and will pass while the two engines disagree.", file=sys.stderr)
              print("   Fix: bash scripts/sync_parity_fixtures.sh, then commit the frontend diff.", file=sys.stderr)
              sys.exit(1)
          print(f"   {f}.json matches the committed fixture")
          PY
          done

      # The valuation book is this product. Until now the calibration bar was a
      # manual local command with a git-ignored baseline, so nothing stopped a
      # change from quietly regressing accuracy. This fails the build on either
      # failure mode the harness detects: a name moving FURTHER from the
      # independent ground truth (hard break), or overall within-band accuracy
      # falling below the committed baseline.
      - name: Valuation calibration gate (no regression, no hard breaks)
        env:
          DATABASE_URL: "sqlite:////tmp/ci_calib.db"
        run: python tests/calibration_check.py --baseline tests/calib_baseline.json

  backend-tests-postgres:
    # FIX-26 (TEST-01): prod is Postgres; run the real dialect. Catches the class
    # of bug found only in prod on migration day (pg8000 TLS, sequence resync,
    # JSON column behaviour, Postgres-only migration branches).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terminal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+pg8000://postgres:postgres@localhost:5432/terminal_ci"
      # A non-SQLite URL trips the prod gate that requires a signing secret — set
      # a throwaway CI value (never a real key).
      AUTH_SECRET: "ci-postgres-throwaway-secret-000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Boot migrations must succeed on Postgres (fail-closed sanity)
        run: python -c "from app.migrations_boot import run_boot_migrations as r; out=r(); print(out); assert not str(out).lower().startswith('error'), out"
      - name: Run test suite (Postgres)
        run: python -m pytest tests/ -q
